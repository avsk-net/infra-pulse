services:
  app:
    image: ghcr.io/avsk-net/infra-pulse:latest
    container_name: infra-pulse
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      - APP_VERSION=${APP_VERSION:-unknown}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"\]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
